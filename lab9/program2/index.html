<!DOCTYPE html>

<html>

<head>

    <title>Student Registration</title>

</head>

<body>

    <h2>Student Registration Form</h2>

    <form id="studentForm">

        <label>Name:</label>

        <input
            type="text"
            id="name"
            name="name"
            value="Suprim Maharjan"
        >

        <br><br>

        <label>Roll Number:</label>

        <input
            type="text"
            id="roll"
            name="roll"
        >

        <br><br>

        <label>Course:</label>

        <input
            type="text"
            id="course"
            name="course"
            value="BCA"
        >

        <br><br>

        <label>Semester:</label>

        <input
            type="number"
            id="semester"
            name="semester"
            value="4"
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <br>

    <div id="message"></div>

    <script>

        document
        .getElementById("studentForm")
        .addEventListener(
            "submit",
            function(event)
            {

                event.preventDefault();

                let formData =
                    new FormData(this);

                let xhr =
                    new XMLHttpRequest();

                xhr.open(
                    "POST",
                    "register.php",
                    true
                );

                xhr.onload = function()
                {

                    document
                    .getElementById("message")
                    .innerHTML =
                        xhr.responseText;

                };

                xhr.send(formData);

            }
        );

    </script>

</body>

</html>
